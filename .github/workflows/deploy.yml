name: Deploy

on:
  push:
    tags:
      - "*.*.*"

permissions: {}

jobs:
  authorize-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authorize release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREFLIGHT_MAX_AGE_SECONDS: "86400"
          PREFLIGHT_FUTURE_TOLERANCE_SECONDS: "300"
        run: bash scripts/fls_release_status.sh authorize

  build:
    needs: authorize-release
    permissions:
      contents: read
    uses: ./.github/workflows/build-guidelines.yml
    with:
      offline: true

  deploy:
    needs: build
    # Always run so that 'deploy' explicitly fails when build fails,
    # rather than being skipped. Skipped jobs don't block merge queue.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      statuses: write
    steps:
      - name: Fail if build failed
        if: needs.build.result != 'success'
        run: |
          echo "::error::build workflow failed with result: ${{ needs.build.result }}"
          exit 1
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build

      - name: Check artifacts
        run: |
          ls build
          ls build/html

      - name: Add CNAME to be able to be seen at coding-guidelines.arewesafetycriticalyet.org
        run: |
          echo "coding-guidelines.arewesafetycriticalyet.org" > ./build/html/CNAME

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/html

      - name: Record successful deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/fls_release_status.sh deployed
